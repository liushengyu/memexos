[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memexos"
version = "0.1.0.dev0"
description = "A memory OS for you and your agents: agents compile what you collect into a verified, searchable wiki."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "The MemexOS Authors" }]
keywords = ["knowledge-base", "agents", "llm", "wiki", "memory", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]
# The core uses only the Python standard library. Everything heavier is an
# optional external tool (detected at runtime by `memex doctor`).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
anthropic = ["anthropic>=1.0"]

[project.scripts]
memex = "memexos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memexos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# Bug-finding rules only: syntax and import errors, undefined or unused names, likely bugs (bugbear).
# Formatting and style are left to the code's own conventions.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  "E741",  # single-letter names such as `l` for a line are used deliberately in short comprehensions
  "E731",  # small named lambdas are used for local formatting helpers
  "B905",  # zip() over sequences built to the same length
]
