[help]
admin = """维护命令（一般由定时任务调用，也可以手动运行）

  memex init [路径]            建知识库和你的设置
  memex doctor                 检查工具、模型和设置
  memex config show|path       看生效的设置 / 设置文件在哪
  memex status [-w]            在做什么、今天做完了什么、有什么要注意
  memex ingest                 把新的 raw 编译进 wiki（过门 1、门 2 才发布）
  memex lint                   每周体检
  memex fix                    修复审校发现的问题
  memex correct                按 raw/feedback/ 里的反馈更正
  memex intake [--source ...]  从启用的渠道采集，决定收不收
  memex add-url | add-video | add-visual
  memex catalog stats|list|drafts|sync|backlog
  memex inbox stats|list|triage|apply
  memex reindex                重建检索索引
  memex usage                  知识库被怎么用
  memex console                本机网页控制台
  memex schedule install|remove|list
  memex eval retrieval|gate2   测检索和审校的质量"""

