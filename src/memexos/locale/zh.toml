next = """
接下来：
  memex doctor              看看哪些工具和模型可用
  memex add-url <链接>      往 raw/ 放第一份资料
  memex ingest              把它编译进 wiki（装好定时任务后会自动跑）
  memex search "<问题>" --kw "<关键词>"
  memex schedule install    让采集、编译、建索引自动运行"""

