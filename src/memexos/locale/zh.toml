[hold]
title = "# 未发布的编译 — {date}"
entry = """## {time} · `{branch}`

- 原因：{reason}
- 涉及：{files}
- 查看改动：`git -C {vault} diff {base} {branch}`
- 采纳：`git -C {vault} merge {branch}`，并把这些文件从 `.memex/held.txt` 删掉、加进 `.memex/ingested.txt`
- 放弃并重新编译：`git -C {vault} branch -D {branch}`，并把这些文件从 `.memex/held.txt` 删掉"""

